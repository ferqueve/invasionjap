<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juego del Día del Programador</title>
    <!-- Cargamos Phaser desde CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/phaser/3.55.2/phaser.min.js"></script>
    <style>
        /* Estilo básico para centrar el juego en la pantalla */
        body { margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #000; }
    </style>
</head>
<body>
<script>
// Configuración básica del juego
const config = {
    type: Phaser.AUTO,
    width: 800,
    height: 600,
    physics: {
        default: 'arcade',
        arcade: {
            gravity: { y: 0 },
            debug: false
        }
    },
    scene: {
        preload: preload,
        create: create,
        update: update
    }
};

// Inicialización del juego con la configuración
const game = new Phaser.Game(config);

// Variables globales para los elementos del juego
let player;          // Objeto del jugador
let enemies;         // Grupo de enemigos
let bullets;         // Grupo de balas
let hearts;          // Grupo de corazones (power-ups de salud)
let obstacles;       // Grupo de obstáculos
let cursors;         // Objeto para manejar las entradas del teclado
let scoreText;       // Texto para mostrar la puntuación
let healthBar;       // Barra gráfica de salud
let healthText;      // Texto para mostrar la salud numérica
let spaceKey;        // Tecla espaciadora (para disparar)
let enterKey;        // Tecla Enter (para pausar/reiniciar)
let escKey;          // Tecla Esc (para salir)
let lastFired = 0;   // Timestamp del último disparo (para controlar la cadencia)
let score = 0;       // Puntuación del jugador
let health = 100;    // Salud del jugador
let lastMoveDirection = new Phaser.Math.Vector2(1, 0);  // Última dirección de movimiento (para orientar los disparos)
let isPaused = false; // Estado de pausa del juego
let pauseText;       // Texto que se muestra cuando el juego está en pausa

// Función para cargar assets
function preload() {
    this.load.image('background', 'img/background.png');
    this.load.image('player', 'img/player.png');
    this.load.image('enemy', 'img/enemy.png');
    this.load.image('bullet', 'img/bullet.png');
    this.load.image('heart', 'img/heart.png');
    this.load.image('obstacle', 'img/obstacle.png');
}

// Función para crear los elementos del juego
function create() {
    // Añadir fondo
    this.add.image(400, 300, 'background').setDisplaySize(800, 600);

    // Añadir banner de felicitación
    const banner = this.add.text(400, 50, '¡Feliz Día del Programador!\nte desea Jóvenes a Programar', { 
        fontSize: '24px', 
        fontFamily: 'Arial', 
        fill: '#FFD700', 
        align: 'center',
        backgroundColor: '#000080',
        padding: { x: 10, y: 5 }
    }).setOrigin(0.5);
    
    // Crear jugador
    player = this.physics.add.sprite(400, 300, 'player');
    player.setDisplaySize(32, 32);
    player.setCollideWorldBounds(true);

    // Crear grupos para enemigos, balas, corazones y obstáculos
    enemies = this.physics.add.group();
    bullets = this.physics.add.group();
    hearts = this.physics.add.group();
    obstacles = this.physics.add.staticGroup();

    // Crear obstáculos aleatorios
    for (let i = 0; i < 15; i++) {
        const x = Phaser.Math.Between(100, 700);
        const y = Phaser.Math.Between(100, 500);
        obstacles.create(x, y, 'obstacle').setDisplaySize(40, 40).refreshBody();
    }

    // Configuramos los controles
    cursors = this.input.keyboard.createCursorKeys();
    spaceKey = this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.SPACE);
    enterKey = this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.ENTER);
    escKey = this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.ESC);

    // Añadimos texto de puntuación
    scoreText = this.add.text(16, 16, 'Puntuación: 0', { 
        fontSize: '24px', 
        fontFamily: 'Arial', 
        fill: '#FFFFFF',
        stroke: '#000000',
        strokeThickness: 4
    });

    // Creamos barra de salud
    const healthBarBackground = this.add.rectangle(110, 60, 200, 20, 0x000000);
    healthBar = this.add.rectangle(110, 60, 200, 20, 0xff0000); //bien rojita
    healthText = this.add.text(110, 60, 'Salud: 100', { 
        fontSize: '18px', 
        fontFamily: 'Arial', 
        fill: '#FFFFFF',
        stroke: '#000000',
        strokeThickness: 3
    }).setOrigin(0.5);

    // Configurar colisiones
    this.physics.add.collider(player, enemies, hitEnemy, null, this);
    this.physics.add.collider(player, obstacles);
    this.physics.add.collider(enemies, obstacles);
    this.physics.add.collider(bullets, enemies, hitBullet, null, this);
    this.physics.add.collider(bullets, obstacles, hitObstacle, null, this);
    this.physics.add.overlap(player, hearts, collectHeart, null, this);

    // Configurar eventos de tiempo para generar enemigos y corazones
    this.time.addEvent({ delay: 1000, callback: spawnEnemy, callbackScope: this, loop: true });
    this.time.addEvent({ delay: 10000, callback: spawnHeart, callbackScope: this, loop: true });

    // Crear texto de pausa
    pauseText = this.add.text(400, 300, 'PAUSA\nPresiona ENTER para continuar\nPresiona ESC para salir', {
        fontSize: '32px',
        fontFamily: 'Arial',
        fill: '#FFFFFF',
        align: 'center',
        stroke: '#000000',
        strokeThickness: 4
    }).setOrigin(0.5);
    pauseText.setVisible(false);
}

// Función de actualización del juego
function update(time) {
    // Manejo de pausa y reinicio
    if (Phaser.Input.Keyboard.JustDown(enterKey)) {
        togglePause();
    }

    if (Phaser.Input.Keyboard.JustDown(escKey)) {
        this.scene.restart();
    }

    if (isPaused) {
        return;
    }

    // Movimiento del jugador
    player.body.setVelocity(0);

    if (cursors.left.isDown) {
        player.body.setVelocityX(-160);
        lastMoveDirection.set(-1, 0).normalize();
    } else if (cursors.right.isDown) {
        player.body.setVelocityX(160);
        lastMoveDirection.set(1, 0).normalize();
    }

    if (cursors.up.isDown) {
        player.body.setVelocityY(-160);
        lastMoveDirection.set(0, -1).normalize();
    } else if (cursors.down.isDown) {
        player.body.setVelocityY(160);
        lastMoveDirection.set(0, 1).normalize();
    }

    player.body.velocity.normalize().scale(160);

    // Disparar piuuuuu piuuuuuu!!!!
    if (spaceKey.isDown && time > lastFired + 250) {
        shootBullet.call(this);
        lastFired = time;
    }

    updateHealthBar();
}

// Función para alternar el estado de pausa
function togglePause() {
    isPaused = !isPaused;
    if (isPaused) {
        this.physics.pause();
        pauseText.setVisible(true);
    } else {
        this.physics.resume();
        pauseText.setVisible(false);
    }
}

// Función para actualizar la barra de salud
function updateHealthBar() {
    healthBar.width = health * 2;
    healthText.setText(`Salud: ${health}`);
}

// Función para disparar balas
function shootBullet() {
    const angle = Math.atan2(lastMoveDirection.y, lastMoveDirection.x);
    const velocity = this.physics.velocityFromRotation(angle, 400);
    const bullet = bullets.create(player.x, player.y, 'bullet');
    bullet.setDisplaySize(10, 10);
    bullet.setVelocity(velocity.x, velocity.y);
}

// Función para generar enemigos. 
function spawnEnemy() { 
    const x = Phaser.Math.Between(0, 800);
    const y = Phaser.Math.Between(0, 600);
    const enemy = enemies.create(x, y, 'enemy');
    enemy.setDisplaySize(32, 32);
    this.physics.moveToObject(enemy, player, 100); //Aleatoreamente pero persiguen al jugador
}

// Función para generar corazones
function spawnHeart() { //Aleatoreamente en la pantalla
    const x = Phaser.Math.Between(0, 800);
    const y = Phaser.Math.Between(0, 600);
    hearts.create(x, y, 'heart').setDisplaySize(16, 16);
}

// Función para manejar colisiones entre jugador y enemigo
function hitEnemy(player, enemy) {
    enemy.destroy();
    health -= 20;
    updateHealthBar();
    showAuchEffect(this, player.x, player.y); //Ahora sí, mostramos el Auch! cuando le pegan al hitbox
    if (health <= 0) {
        gameOver.call(this, false);
    }
}

// Función para mostrar efecto "Auch!"
function showAuchEffect(scene, x, y) {
    //Seteo el texto, css y coordenadas
    const auchText = scene.add.text(x, y - 20, 'Auch!', {
        fontSize: '24px',
        fontFamily: 'Arial',
        fill: '#FF0000',
        stroke: '#FFFFFF',
        strokeThickness: 2
    }).setOrigin(0.5);
    //Lo agrego y elimino una vez se muestre 800 milisegundos
    scene.tweens.add({
        targets: auchText,
        y: y - 50,
        alpha: 0,
        duration: 800,
        ease: 'Power2',
        onComplete: function() {
            auchText.destroy();
        }
    });
}

// Función para manejar colisiones entre balas y enemigos
function hitBullet(bullet, enemy) {
    bullet.destroy(); //Quito la bala y el enemigo
    enemy.destroy(); 
    score += 10; //Sumo 10 a la puntuación
    scoreText.setText('Puntuación: ' + score); //Muestro nueva puntuación
    if (score >= 1000) { //Me fijo si ganamos 
        gameOver.call(this, true);
    }
}

// Función para manejar colisiones entre balas y obstáculos
function hitObstacle(bullet) {
    bullet.destroy(); //A futuro. ¿Poner un rebote? ¿o es mucho?
}

// Función para recoger corazones
function collectHeart(player, heart) {
    heart.destroy();// El objeto debe desaparecer cuando lo obtengo, la salud aumenta.
    health = Math.min(health + 20, 100);
    updateHealthBar(); //Actualizo la vista en la barrita de salud. Sin atchís.
}

// Función de fin de juego
function gameOver(victory) {
    this.physics.pause();
    const message = victory ? 'Has derrotado al Tutor Oscuro' : 'Has sido vencido por el Tutor Oscuro';
    this.add.text(400, 250, message, { 
        fontSize: '32px', 
        fontFamily: 'Arial', 
        fill: victory ? '#00ff00' : '#ff0000',
        stroke: '#000000',
        strokeThickness: 4
    }).setOrigin(0.5);

    this.add.text(400, 350, 'Presiona ENTER para reiniciar\nPresiona ESC para salir', {
        fontSize: '24px',
        fontFamily: 'Arial',
        fill: '#FFFFFF',
        align: 'center',
        stroke: '#000000',
        strokeThickness: 3
    }).setOrigin(0.5);

    this.input.keyboard.once('keydown-ENTER', () => {
        // Reiniciar la escena y restablecer la salud y la puntuación
        health = 100;
        score = 0;
        this.scene.restart();
    });

    this.input.keyboard.once('keydown-ESC', () => {
        // Intenta cerrar la ventana del navegador
        window.close();
    });
}
</script>
</body>
</html>
